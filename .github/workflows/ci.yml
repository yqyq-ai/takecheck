name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Rebuild synthetic test media
        run: python scripts/make_testmedia.py --dest "${RUNNER_TEMP}/testmedia"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Self-test
        run: takecheck selftest

      - name: Fixture verdicts
        run: python scripts/check_synthetic.py

      - name: HTML report renders
        run: |
          cp examples/takes.yml "${RUNNER_TEMP}/takes.yml"
          takecheck check testmedia/synthetic/subtitle.mp4 \
            --spec "${RUNNER_TEMP}/takes.yml" \
            --html "${RUNNER_TEMP}/report.html" || true
          test -s "${RUNNER_TEMP}/report.html"
          grep -q "data:image/jpeg;base64," "${RUNNER_TEMP}/report.html"
          grep -q "tile flagged" "${RUNNER_TEMP}/report.html"

      - name: Build wheel
        run: pip wheel --no-deps -w dist .
