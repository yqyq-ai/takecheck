name: h3-ep12-shot03
# Optional: bind the spec to one file. `takecheck check` takes the path on the CLI anyway.
video: out/shot03.mp4
expect:
  duration: 5.0
  fps: 24
  frames: 121
  resolution: 1280x720
  audio: required
  # `forbidden` turns the subtitle-residue check on. It looks for a band of text
  # in the bottom 72%-92% of the frame; set it to `allowed` to skip that work.
  # Note: a scene that legitimately contains text in the lower third will trip
  # this check, so relax it for titles and lower-thirds.
  subtitles: forbidden
  frozen_max_ms: 200
  black_max_frames: 0
  flicker_max: 0.35
  # Mean frame-to-frame difference on 32x32 gray thumbnails, 0..1.
  # Reference points measured on the bundled fixtures: a normally moving clip
  # scores ~0.009, a still render ~0.000. Raise this for slow, quiet shots.
  motion_min: 0.002
judges:
  - mechanical
  # - vlm: { backend: llama.cpp, model: qwen3.8-27b }
